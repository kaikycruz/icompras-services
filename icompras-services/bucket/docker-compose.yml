version: '3.9'

services:
  minio:
    image: pgsty/silo:latest
    container_name: minio
    ports:
      - "9000:9000" #API
      - "9001:9001" #consele web
    volumes:
        - ./docs:/data
    environment:
        MINIO_ROOT_USER: admin
        MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    restart: unless-stopped
