spring:
  application:
    name: faturamento
  kafka:
    bootstrap-servers: 'https://localhost:29092'
    consumer:
      group-id: icompras-faturamento
      auto-offset-reset: earliest

icompras:
  config:
    kafka:
      topics:
        pedidos-pagos: 'icompras.pedidos-pagos'

server:
  port: 8083

minio:
  url: 'http://localhost:9000'
  access-key: admin
  secret-key: minioadmin123
  bucket-name: icompras.faturas

